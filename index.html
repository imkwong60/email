<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#7c3aed" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="電郵本本">
    <meta name="description" content="J.Law Gmail">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/jpeg" href="kumamon-icon.jpg">
    <link rel="apple-touch-icon" href="kumamon-icon.jpg">
    <title>電郵本本 J.Law Gmail</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'Noto Sans TC', 'system-ui', 'sans-serif'] },
                    colors: {
                        brand: {
                            50:'#f5f3ff',100:'#ede9fe',200:'#ddd6fe',300:'#c4b5fd',400:'#a78bfa',
                            500:'#8b5cf6',600:'#7c3aed',700:'#6d28d9',800:'#5b21b6',900:'#4c1d95',950:'#2e1065'
                        }
                    },
                    animation: {
                        'slide-down': 'slideDown 0.4s cubic-bezier(0.16,1,0.3,1)',
                        'fade-in': 'fadeIn 0.3s ease-out',
                        'pulse-soft': 'pulseSoft 2s cubic-bezier(0.4,0,0.6,1) infinite',
                    },
                    keyframes: {
                        slideDown: { '0%':{transform:'translateY(-100%)',opacity:'0'}, '100%':{transform:'translateY(0)',opacity:'1'} },
                        fadeIn: { '0%':{opacity:'0'}, '100%':{opacity:'1'} },
                        pulseSoft: { '0%,100%':{opacity:'1'}, '50%':{opacity:'0.6'} }
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar{width:5px;height:5px} ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#d4d4d8;border-radius:9999px} .dark ::-webkit-scrollbar-thumb{background:#3f3f46}
        .glass{background:rgba(255,255,255,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
        .dark .glass{background:rgba(24,24,27,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
        .error-banner{background:linear-gradient(135deg,rgba(251,191,36,.15) 0%,rgba(244,63,94,.12) 100%);border:1px solid rgba(251,191,36,.35);box-shadow:0 4px 24px -4px rgba(251,191,36,.15),inset 0 1px 0 rgba(255,255,255,.1)}
        .dark .error-banner{background:linear-gradient(135deg,rgba(251,191,36,.12) 0%,rgba(244,63,94,.1) 100%);border-color:rgba(251,191,36,.25)}
        .no-scrollbar::-webkit-scrollbar{display:none} .no-scrollbar{-ms-overflow-style:none;scrollbar-width:none}
        .line-clamp-1{display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
        .line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .safe-top{padding-top:max(16px, env(safe-area-inset-top))} .safe-bottom{padding-bottom:max(10px, env(safe-area-inset-bottom))}
        html,body{height:100%;overflow:hidden} body{-webkit-overflow-scrolling:auto;overscroll-behavior:none}
        #appHeader{flex-shrink:0;position:relative;z-index:40;transform:translateZ(0);isolation:isolate}
        #appHeader button{position:relative;z-index:2;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
        #emailListContainer{-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-zinc-50 dark:bg-zinc-950 text-zinc-900 dark:text-zinc-100 font-sans antialiased min-h-screen flex flex-col items-center justify-start transition-colors duration-300 overflow-x-hidden">

    <!-- Error Banner -->
    <div id="errorBanner" class="fixed top-0 left-0 right-0 z-50 hidden animate-slide-down pointer-events-none">
        <div class="max-w-md sm:max-w-lg md:max-w-xl lg:max-w-2xl mx-auto px-4 pt-3 safe-top">
            <div class="error-banner glass rounded-2xl px-4 py-3.5 flex items-start gap-3 shadow-lg pointer-events-auto">
                <div class="flex-shrink-0 mt-0.5">
                    <div class="w-8 h-8 rounded-xl bg-amber-500/20 flex items-center justify-center">
                        <svg class="w-4 h-4 text-amber-600 dark:text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
                    </div>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-amber-500 animate-pulse-soft"></span>
                        <p id="errorTitle" class="text-sm font-semibold text-amber-900 dark:text-amber-200">同步異常</p>
                    </div>
                    <p id="errorMessage" class="text-xs text-amber-800/80 dark:text-amber-300/80 leading-relaxed"></p>
                </div>
                <button onclick="dismissErrorBanner()" class="flex-shrink-0 w-7 h-7 rounded-full bg-amber-500/10 hover:bg-amber-500/20 flex items-center justify-center text-amber-700 dark:text-amber-300 transition">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- iOS Install Banner -->
    <div id="iosInstallBanner" class="fixed bottom-0 left-0 right-0 z-40 hidden animate-fade-in safe-bottom">
        <div class="max-w-md sm:max-w-lg mx-auto px-4 pb-4">
            <div class="glass rounded-2xl p-4 shadow-2xl border border-zinc-200/60 dark:border-zinc-700/60 flex items-center gap-3">
                <img src="kumamon-icon.jpg" alt="App Icon" class="w-12 h-12 rounded-xl shadow-md object-cover">
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-bold text-zinc-900 dark:text-white">加入主畫面</p>
                    <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">點擊分享 →「加入主畫面」以獲得完整體驗與通知</p>
                </div>
                <button onclick="dismissIosBanner()" class="text-xs font-medium text-brand-600 dark:text-brand-400 px-3 py-1.5 rounded-lg bg-brand-50 dark:bg-brand-900/40">知道了</button>
            </div>
        </div>
    </div>


    <!-- Login Overlay -->
    <div id="loginOverlay" class="fixed inset-0 z-[100] bg-zinc-950/90 backdrop-blur-md hidden items-center justify-center p-4">
        <div class="w-full max-w-sm bg-white dark:bg-zinc-900 rounded-3xl shadow-2xl border border-zinc-200 dark:border-zinc-800 p-6">
            <div class="flex items-center gap-3 mb-5">
                <img src="kumamon-icon.jpg" alt="" class="w-12 h-12 rounded-2xl object-cover shadow-md">
                <div>
                    <h2 class="text-base font-bold text-zinc-900 dark:text-white">登入電郵本本</h2>
                    <p class="text-[11px] text-zinc-500">使用 Supabase Auth，僅白名單帳號可進入</p>
                </div>
            </div>
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="text-[11px] font-medium text-zinc-500 mb-1 block">Email</label>
                    <input id="loginEmail" type="email" required autocomplete="username"
                        class="w-full px-3.5 py-2.5 bg-zinc-100 dark:bg-zinc-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                        placeholder="you@gmail.com">
                </div>
                <div>
                    <label class="text-[11px] font-medium text-zinc-500 mb-1 block">密碼</label>
                    <input id="loginPassword" type="password" required autocomplete="current-password"
                        class="w-full px-3.5 py-2.5 bg-zinc-100 dark:bg-zinc-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand-500"
                        placeholder="••••••••">
                </div>
                <p id="loginError" class="text-xs text-rose-600 hidden"></p>
                <button type="submit" id="loginBtn"
                    class="w-full py-3 rounded-2xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold transition">
                    登入
                </button>
            </form>
            <p class="text-[10px] text-zinc-400 mt-4 leading-relaxed">
                在 Supabase Dashboard → Authentication 建立使用者；Edge Secrets 設定 ALLOWED_EMAILS 白名單。
            </p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md sm:max-w-lg md:max-w-xl lg:max-w-2xl min-h-screen sm:min-h-[90vh] sm:my-6 sm:rounded-3xl sm:shadow-2xl bg-white dark:bg-zinc-900 border border-zinc-200/80 dark:border-zinc-800 flex flex-col overflow-hidden relative transition-all">

        <!-- Header -->
        <header id="appHeader" class="glass z-40 px-4 pb-3 border-b border-zinc-100 dark:border-zinc-800/80 safe-top relative">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center space-x-2.5">
                    <div class="w-9 h-9 rounded-2xl overflow-hidden shadow-lg shadow-brand-500/25 ring-2 ring-white/50 dark:ring-zinc-800">
                        <img src="kumamon-icon.jpg" alt="電郵本本" class="w-full h-full object-cover">
                    </div>
                    <div>
                        <h1 class="text-base font-bold tracking-tight text-zinc-900 dark:text-white flex items-center gap-1.5">
                            電郵本本
                            
                        </h1>
                        <p class="text-[10px] text-zinc-500 dark:text-zinc-400">極致簡約 · 智慧信箱</p>
                    </div>
                </div>
                <div class="flex items-center space-x-1">
                    <!-- Push Subscribe Button -->
                    <button id="pushBtn" onclick="togglePush()" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 flex items-center justify-center text-zinc-600 dark:text-zinc-300 transition relative" title="訂閱推送通知">
                        <i id="pushIcon" class="fa-solid fa-bell text-xs"></i>
                        <span id="pushDot" class="absolute top-0.5 right-0.5 w-2 h-2 rounded-full bg-rose-500 hidden"></span>
                    </button>
                    <button onclick="triggerSync()" id="syncBtn" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 flex items-center justify-center text-zinc-600 dark:text-zinc-300 transition" title="立即同步">
                        <i id="syncIcon" class="fa-solid fa-arrows-rotate text-xs"></i>
                    </button>
                    <button onclick="toggleSearch()" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 flex items-center justify-center text-zinc-600 dark:text-zinc-300 transition" title="搜尋">
                        <i class="fa-solid fa-magnifying-glass text-xs"></i>
                    </button>
                    <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 flex items-center justify-center text-zinc-600 dark:text-zinc-300 transition" title="外觀">
                        <i id="themeIcon" class="fa-solid fa-moon text-xs"></i>
                    </button>
                    <button onclick="switchTab('compose')" id="composeBtn" class="w-8 h-8 rounded-full bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 flex items-center justify-center text-zinc-600 dark:text-zinc-300 transition" title="寫新郵件">
                        <i class="fa-solid fa-pen-to-square text-xs"></i>
                    </button>
                </div>
            </div>

            <!-- Search -->
            <div id="searchContainer" class="hidden mb-3 transition-all duration-300">
                <div class="relative">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-zinc-400 text-sm"></i>
                    <input type="text" id="searchInput" oninput="handleSearch(this.value)" placeholder="搜尋寄件者、標題或關鍵字..." class="w-full pl-9 pr-9 py-2 bg-zinc-100 dark:bg-zinc-800/80 border border-transparent focus:border-brand-500 rounded-xl text-sm focus:outline-none transition">
                    <button onclick="clearSearch()" class="absolute right-3 top-2.5 text-zinc-400 hover:text-zinc-600"><i class="fa-solid fa-xmark text-sm"></i></button>
                </div>
            </div>

            <!-- Category Pills + Compose -->
            <div class="flex space-x-1.5 overflow-x-auto pb-1 no-scrollbar">
                <button onclick="switchTab('important')" id="pill-important" class="pill-btn flex items-center space-x-1 px-3 py-1.5 rounded-full text-[11px] font-semibold whitespace-nowrap transition-all">
                    <i class="fa-solid fa-circle-exclamation text-[10px]"></i><span>重要</span>
                    <span id="badge-important" class="ml-0.5 px-1.5 py-0.5 rounded-full text-[9px] bg-white/25 min-w-[16px] text-center">0</span>
                </button>
                <button onclick="switchTab('transaction')" id="pill-transaction" class="pill-btn flex items-center space-x-1 px-3 py-1.5 rounded-full text-[11px] font-semibold whitespace-nowrap transition-all">
                    <i class="fa-solid fa-receipt text-[10px]"></i><span>交易</span>
                    <span id="badge-transaction" class="ml-0.5 px-1.5 py-0.5 rounded-full text-[9px] bg-white/25 min-w-[16px] text-center">0</span>
                </button>
                <button onclick="switchTab('promotion')" id="pill-promotion" class="pill-btn flex items-center space-x-1 px-3 py-1.5 rounded-full text-[11px] font-semibold whitespace-nowrap transition-all">
                    <i class="fa-solid fa-ticket text-[10px]"></i><span>著數</span>
                    <span id="badge-promotion" class="ml-0.5 px-1.5 py-0.5 rounded-full text-[9px] bg-white/25 min-w-[16px] text-center">0</span>
                </button>
                <button onclick="switchTab('trash')" id="pill-trash" class="pill-btn flex items-center space-x-1 px-3 py-1.5 rounded-full text-[11px] font-semibold whitespace-nowrap transition-all">
                    <i class="fa-solid fa-trash-can text-[10px]"></i><span>待刪</span>
                    <span id="badge-trash" class="ml-0.5 px-1.5 py-0.5 rounded-full text-[9px] bg-white/25 min-w-[16px] text-center">0</span>
                </button>
                <button onclick="switchTab('compose')" id="pill-compose" class="pill-btn flex items-center space-x-1 px-3 py-1.5 rounded-full text-[11px] font-semibold whitespace-nowrap transition-all bg-brand-600 text-white shadow-md shadow-brand-500/30">
                    <i class="fa-solid fa-pen-to-square text-[10px]"></i><span>寄信</span>
                </button>
            </div>
        </header>

        <!-- Bulk Actions (hidden on compose) -->
        <div id="bulkBar" class="px-4 py-2 flex items-center justify-between border-b border-zinc-100 dark:border-zinc-800/60 bg-zinc-50/50 dark:bg-zinc-900/50">
            <span id="listStatus" class="text-[11px] text-zinc-500 dark:text-zinc-400">載入中...</span>
            <button onclick="confirmClearCategory()" class="text-[11px] font-medium text-rose-600 dark:text-rose-400 hover:text-rose-700 flex items-center gap-1 transition">
                <i class="fa-solid fa-trash-can text-[10px]"></i> 清空此分頁
            </button>
        </div>

        <!-- Email List / Compose -->
        <main class="flex-1 overflow-y-auto p-3 space-y-2.5" id="emailListContainer">
            <div class="flex flex-col items-center justify-center py-20 text-zinc-400">
                <i class="fa-solid fa-spinner fa-spin text-2xl mb-3"></i>
                <p class="text-sm">正在載入郵件...</p>
            </div>
        </main>

        <!-- Footer -->
        <footer class="glass px-4 py-2.5 border-t border-zinc-100 dark:border-zinc-800/80 flex items-center justify-between text-[11px] text-zinc-500 dark:text-zinc-400 safe-bottom">
            <div id="statusText" class="flex items-center gap-1.5">
                <span id="statusDot" class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                <span id="statusLabel">準備就緒</span>
            </div>
            <button id="markAllBtn" onclick="markAllAsRead()" class="hover:text-brand-600 dark:hover:text-brand-400 transition font-medium">全部標為已讀</button>
        </footer>
    </div>

    <!-- Email Detail Modal -->
    <div id="emailModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden items-end sm:items-center justify-center p-0 sm:p-4 transition-all opacity-0 pointer-events-none">
        <div id="modalContent" class="bg-white dark:bg-zinc-900 w-full max-w-lg rounded-t-3xl sm:rounded-3xl max-h-[88vh] flex flex-col shadow-2xl transform translate-y-full sm:translate-y-0 transition-transform duration-300 overflow-hidden border border-zinc-200 dark:border-zinc-800">
            <div class="px-5 py-3.5 border-b border-zinc-100 dark:border-zinc-800 flex items-center justify-between bg-zinc-50/60 dark:bg-zinc-800/40">
                <div class="flex items-center space-x-3">
                    <div id="modalAvatar" class="w-10 h-10 rounded-full flex items-center justify-center text-white font-bold text-sm shadow-md"></div>
                    <div class="min-w-0">
                        <h3 id="modalSender" class="font-bold text-sm text-zinc-900 dark:text-white truncate"></h3>
                        <p id="modalEmail" class="text-[11px] text-zinc-500 dark:text-zinc-400 truncate"></p>
                    </div>
                </div>
                <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-zinc-200/70 dark:bg-zinc-700/70 hover:bg-zinc-300 dark:hover:bg-zinc-600 flex items-center justify-center text-zinc-600 dark:text-zinc-300 transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
            </div>
            <div class="p-5 overflow-y-auto space-y-3.5 flex-1">
                <div class="flex items-center justify-between text-[11px] text-zinc-400">
                    <span id="modalDate"></span>
                    <span id="modalCategoryTag" class="px-2 py-0.5 rounded-full font-medium"></span>
                </div>
                <h2 id="modalSubject" class="text-base font-bold text-zinc-900 dark:text-white leading-snug"></h2>
                <div id="modalAttachment" class="hidden flex items-center gap-2 text-xs text-zinc-500 bg-zinc-100 dark:bg-zinc-800 px-3 py-2 rounded-xl">
                    <i class="fa-solid fa-paperclip"></i><span>此郵件包含附件</span>
                </div>
                <div class="h-px bg-zinc-100 dark:bg-zinc-800"></div>
                <div id="modalBodyText" class="text-sm text-zinc-700 dark:text-zinc-300 leading-relaxed whitespace-pre-line"></div>
            </div>
            <div class="px-5 py-3 border-t border-zinc-100 dark:border-zinc-800 bg-zinc-50/60 dark:bg-zinc-800/40 flex items-center justify-between gap-2">
                <div class="flex gap-2">
                    <button id="modalActionBtn" onclick="modalAction()" class="px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-trash-can"></i> <span>刪除 (Gmail)</span>
                    </button>
                    <a id="modalGmailLink" href="#" target="_blank" rel="noopener" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-zinc-200 dark:bg-zinc-700 hover:bg-zinc-300 dark:hover:bg-zinc-600 text-zinc-800 dark:text-zinc-200 transition flex items-center gap-1.5">
                        <i class="fa-brands fa-google"></i> Gmail
                    </a>
                </div>
                <button onclick="closeModal()" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-brand-600 hover:bg-brand-700 text-white transition">關閉</button>
            </div>
        </div>
    </div>

    <!-- Confirm Clear Modal -->
    <div id="confirmModal" class="fixed inset-0 z-[60] bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 opacity-0 transition-opacity pointer-events-none">
        <div class="bg-white dark:bg-zinc-900 rounded-2xl p-5 max-w-xs w-full shadow-2xl border border-zinc-200 dark:border-zinc-800 transform scale-95 transition-transform">
            <div class="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-900/40 flex items-center justify-center mx-auto mb-3">
                <i class="fa-solid fa-trash-can text-rose-600 dark:text-rose-400 text-lg"></i>
            </div>
            <h3 class="text-center font-bold text-sm text-zinc-900 dark:text-white mb-1">確認清空並刪除？</h3>
            <p class="text-center text-xs text-zinc-500 dark:text-zinc-400 mb-4">會同時把 Gmail 對應郵件移到垃圾桶（最多 20 封），此操作可在 Gmail 還原。</p>
            <div class="flex gap-2">
                <button onclick="closeConfirmModal()" class="flex-1 py-2.5 rounded-xl text-xs font-semibold bg-zinc-100 dark:bg-zinc-800 text-zinc-700 dark:text-zinc-300">取消</button>
                <button onclick="clearCategory()" class="flex-1 py-2.5 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white">確認刪除</button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 transform -translate-x-1/2 z-50 bg-zinc-900 text-white dark:bg-white dark:text-zinc-900 px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-medium flex items-center gap-2.5 transition-all duration-300 translate-y-20 opacity-0 pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-circle-check text-emerald-400"></i>
        <span id="toastMsg">操作成功</span>
    </div>

    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/sync.js"></script>
    <script src="js/render.js"></script>
    <script src="js/compose.js"></script>
    <script src="js/push.js"></script>
    <script src="js/swipe.js"></script>
    <script src="js/email.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
